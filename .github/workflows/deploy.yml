name: Deploy Backend

on:
  push:
    branches:
      - azure-deploy

jobs:
  build:
    if: github.ref == 'refs/heads/azure-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/fastchat-backend:latest .

      - name: Push Docker Image to Docker Hub
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/fastchat-backend:latest

      - name: Deploy to Azure WebApp from Docker Hub
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.DOCKERHUB_USERNAME }}/fastchat-backend:latest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}